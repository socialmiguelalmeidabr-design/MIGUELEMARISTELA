function person(id,cx,feet,scale,phase,opts={}){
 const cells=characters[id],width=id===0?36:34;
 const {direction=1,walking=false,wave=false,hug=false,kissing=false,blow=false,eating=false,kissLean=0,sideHug=false,backArm=false}=opts;
 const stride=walking?Math.sin(phase)*2.0:0;
 const bounce=walking?Math.abs(Math.sin(phase))*0.5:0;
 ctx.save();ctx.translate(Math.round(cx),Math.round(feet));ctx.scale(scale*direction,scale);
 // Side hug: Miguel's rear arm is painted before the bodies, behind Maristela.
 if(backArm){
   rect(23,-28,8,5,'#28354f');rect(28,-27,11,5,'#354866');
   rect(37,-27,8,5,'#c88b69');rect(42,-26,4,3,'#e2ad85');
 }

 // Character cell transforms are computed individually; not a translated picture.
 for(const [x,y,color] of cells){
  let dx=0,dy=-bounce,px=x,py=y-59;
  if(kissing && y<29){dx+=kissLean*clamp((29-y)/24,0,1);dy+=Math.sin(phase*.2)*.12}
  const leftLeg=y>=48&&x<width*.49,rightLeg=y>=48&&x>=width*.49;
  if(leftLeg){dy-=Math.max(0,stride)*Math.min(1,(y-47)/8);dx+=stride*.45}
  if(rightLeg){dy-=Math.max(0,-stride)*Math.min(1,(y-47)/8);dx-=stride*.45}
  const leftArm=y>=29&&y<=49&&x<(id===0?11:9);
  const rightArm=y>=29&&y<=49&&x>(id===0?29:26);
  if(leftArm||rightArm){
   const weight=clamp((y-28)/20,0,1);
   if(walking){dy+=(leftArm?-stride:stride)*.55*weight;dx+=(leftArm?-1:1)*Math.abs(stride)*.22}
   if(wave&&rightArm){dy-=weight*(10+Math.sin(phase*.55)*2);dx+=weight*3}
   if(hug){dy-=weight*9;dx+=(leftArm?-1:1)*(-4)*weight}
   if(kissing){dy-=weight*3;dx+=(leftArm?3:-3)*weight}
   if(blow&&rightArm){dy-=weight*15;dx-=weight*10}
   if(eating){ // Both original arms are replaced by new articulated two-hand eating poses.
     continue;
   }
   if(sideHug){dy-=weight*(leftArm?4:8);dx+=(leftArm?4:-7)*weight}
  }
  rect(px+dx,py+dy,1.02,1.02,palette[color]);
 }
 // Facial changes stay anchored to the character's head.
 if(kissing||blow||eating){
  if(kissing){
   // Perfil dedicado: nariz, queixo e labios sao desenhados na borda que se encontra.
   // O mesmo ponto local e usado pelos dois personagens espelhados.
   const tip=28.5;
   rect(tip-3,-43,4,5,'#b97a59');
   rect(tip,-39,2,3,'#ce8b68');
   rect(tip-2,-36,4,2,'#763c47');
   rect(tip,-35,2,2,'#ef9ba0');
   rect(tip-2,-33,3,2,'#a65d57');
  }else{rect(width*.57,-35,4,2,'#643743');}
 }
 if(eating){
  // Ciclo em 4 fases: segurar -> erguer -> morder -> baixar.
  const cycle=(phase*.075)%(Math.PI*2);
  const lift=(1-Math.cos(cycle))*.5;
  const chew=lift>.82?Math.abs(Math.sin(phase*1.4))*1.2:0;
  const foodY=-26-lift*12;
  const foodX=17;
  const sleeve=id===0?'#f3f0e8':'#3473a4';
  const skin=id===0?'#b77752':'#b9815e';
  // braços reais, simétricos, conectados ao tronco, cotovelos dobrados
  function arm(sx,elbowX,handX){
    const sy=-29,ey=-23-lift*5,hy=foodY+3;
    rect(sx-3,sy-2,6,8,sleeve);
    const x0=Math.min(sx,elbowX),x1=Math.max(sx,elbowX);
    rect(x0,ey,Math.max(4,x1-x0+3),5,sleeve);
    const x2=Math.min(elbowX,handX),x3=Math.max(elbowX,handX);
    rect(x2,Math.min(ey,hy),5,Math.abs(hy-ey)+4,skin);
    rect(x2,hy,Math.max(4,x3-x2+3),4,skin);
  }
  arm(5,8,13);arm(width-5,width-8,22);
  // coxa de frango presa nas duas mãos, acompanhando a mordida
  chicken(foodX,foodY+chew,-.16,.73);
  rect(12,foodY+4,4,4,skin);rect(21,foodY+4,4,4,skin);
  if(lift>.82){rect(15,-39,7,2,'#613d3a');rect(16,-37,5,2,'#d98f88')}
  // migalhas apenas durante a mordida
  if(lift>.85 && Math.sin(phase*1.4)>.5){
    rect(25,-33,2,2,'#f9c85c');rect(27,-29,2,2,'#db8a36');
  }
 }
 ctx.restore();
}

function countdown(){
 const start=new Date(2024,11,31,20,0,0);
 let end=new Date();if(end<start)end=new Date(start);
 let years=end.getFullYear()-start.getFullYear(),months=end.getMonth()-start.getMonth();
 if(months<0){years--;months+=12}
 let anchor=new Date(start);anchor.setFullYear(start.getFullYear()+years);anchor.setMonth(start.getMonth()+months);
 if(anchor>end){months--;if(months<0){years--;months=11}anchor=new Date(start);anchor.setFullYear(start.getFullYear()+years);anchor.setMonth(start.getMonth()+months)}
 let diff=end-anchor,days=Math.floor(diff/86400000);diff%=86400000;
 let hours=Math.floor(diff/3600000);diff%=3600000;let minutes=Math.floor(diff/60000);
 return [years,months,days,hours,minutes];
}
